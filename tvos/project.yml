name: KashiboxTV
options:
  bundleIdPrefix: net.fexel
  deploymentTarget:
    tvOS: "17.0"
  createIntermediateGroups: true
targets:
  KashiboxTV:
    type: application
    platform: tvOS
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Kashibox
        UILaunchScreen: {}
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.fexel.kashibox.tv
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "3"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
schemes:
  KashiboxTV:
    build:
      targets:
        KashiboxTV: all
    run:
      config: Debug
