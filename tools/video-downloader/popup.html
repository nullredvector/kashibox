<!doctype html>
<meta charset="utf-8">
<title>Local video saver</title>
<style>
  body { font: 13px system-ui, sans-serif; width: 360px; margin: 0; padding: 12px; color: #1d1d1f; background: #fff; }
  @media (prefers-color-scheme: dark) { body { color: #f5f5f7; background: #1c1c1e; } .row { border-color: #3a3a3c; } }
  h1 { font-size: 14px; margin: 0 0 8px; }
  .row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid #e5e5ea; }
  .info { flex: 1; min-width: 0; }
  .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { opacity: .6; font-size: 11px; }
  button { padding: 5px 10px; border-radius: 6px; border: 0; background: #0a84ff; color: #fff; cursor: pointer; }
  #empty { opacity: .6; padding: 8px 0; }
</style>
<h1>Videos on this page</h1>
<div id="list"></div>
<div id="empty" hidden>Nothing found yet. Press play on the video, then reopen this.</div>
<script src="popup.js"></script>
