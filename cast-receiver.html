<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Kashibox</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 100vw; height: 100vh;
      background: #050505;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    #idle {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      color: #3a3a3a;
      transition: opacity 0.6s;
      pointer-events: none;
    }
    #idle.hidden { opacity: 0; }
    #idle h1 {
      font-size: 3.5rem;
      font-weight: 200;
      letter-spacing: 0.2em;
      color: #555;
    }
    #idle p { font-size: 1.15rem; }

    #grid {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-content: center;
      justify-content: center;
      padding: 14px;
      max-width: 100vw;
      max-height: 100vh;
    }

    /* Each tile is a vertical video slot — height fills 2 rows, width follows 9:16 */
    .tile {
      position: relative;
      height: calc((100vh - 42px) / 2);
      aspect-ratio: 9 / 16;
      background: #111;
      border-radius: 10px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .tile video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .tile-cover {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      z-index: 1;
      transition: opacity 0.7s;
    }
    .tile-cover.fade { opacity: 0; pointer-events: none; }

    /* White ring flash when a video is added */
    .tile-ring {
      position: absolute;
      inset: 0;
      border-radius: 10px;
      box-shadow: inset 0 0 0 3px rgba(255,255,255,0.85);
      z-index: 2;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.08s;
    }
    .tile.flash .tile-ring { opacity: 1; }
  </style>
</head>
<body>
  <div id="idle">
    <svg viewBox="0 0 24 24" width="72" height="72" fill="#3a3a3a">
      <path d="M21 3H3c-1.1 0-2 .9-2 2v3h2V5h18v14h-7v2h7c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-1 8H10c-.55 0-1 .45-1 1v7c0 .55.45 1 1 1h10c.55 0 1-.45 1-1v-7c0-.55-.45-1-1-1zm-1 7h-8v-5h8v5zM1 18v3h3c0-1.66-1.34-3-3-3zm0-4v2c2.76 0 5 2.24 5 5h2c0-3.87-3.13-7-7-7zm0-4v2c4.97 0 9 4.03 9 9h2C12 14.92 7.08 10 1 10z"/>
    </svg>
    <h1>kashibox</h1>
    <p>Open kashibox on your phone and tap the cast icon on any video</p>
  </div>

  <div id="grid"></div>

  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <script>
    'use strict';

    const NAMESPACE = 'urn:x-cast:net.fexel.kashibox';
    const MAX_TILES = 6; // 3 columns × 2 rows

    const $idle = document.getElementById('idle');
    const $grid = document.getElementById('grid');
    const tiles = []; // { el, vid, cover, addedAt }

    function makeTile() {
      const el    = document.createElement('div');
      el.className = 'tile';

      const vid = document.createElement('video');
      vid.muted       = true;
      vid.loop        = true;
      vid.playsInline = true;
      vid.preload     = 'none';
      el.appendChild(vid);

      const cover = document.createElement('div');
      cover.className = 'tile-cover';
      el.appendChild(cover);

      const ring = document.createElement('div');
      ring.className = 'tile-ring';
      el.appendChild(ring);

      $grid.appendChild(el);
      return { el, vid, cover, addedAt: 0 };
    }

    function fillTile(tile, { videoUrl, coverUrl }) {
      tile.addedAt = Date.now();

      // Show cover while video loads
      tile.cover.style.backgroundImage = coverUrl ? `url("${coverUrl.replace(/"/g, '%22')}")` : '';
      tile.cover.classList.remove('fade');

      // Swap video source
      tile.vid.pause();
      tile.vid.src = '';
      tile.vid.load();
      tile.vid.src = videoUrl;
      tile.vid.load();
      tile.vid.play().catch(() => {});
      tile.vid.addEventListener('playing', () => tile.cover.classList.add('fade'), { once: true });

      // Flash ring
      tile.el.classList.remove('flash');
      void tile.el.offsetWidth; // force reflow to restart transition
      tile.el.classList.add('flash');
      setTimeout(() => tile.el.classList.remove('flash'), 350);
    }

    function addVideo(item) {
      $idle.classList.add('hidden');

      let tile;
      if (tiles.length < MAX_TILES) {
        tile = makeTile();
        tiles.push(tile);
      } else {
        // Replace the tile that was added earliest
        tile = tiles.reduce((a, b) => a.addedAt < b.addedAt ? a : b);
      }
      fillTile(tile, item);
    }

    function clearGrid() {
      tiles.forEach(t => { t.vid.pause(); t.vid.src = ''; });
      tiles.length = 0;
      $grid.innerHTML = '';
      $idle.classList.remove('hidden');
    }

    // Cast Receiver Framework
    const ctx = cast.framework.CastReceiverContext.getInstance();

    ctx.addCustomMessageListener(NAMESPACE, evt => {
      try {
        const msg = evt.data;
        if (msg.action === 'add')   addVideo(msg);
        if (msg.action === 'clear') clearGrid();
      } catch (_) {}
    });

    ctx.start({ disableIdleTimeout: true });
  </script>
</body>
</html>
