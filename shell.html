<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="kashibox" />
		<meta name="theme-color" content="#000000" />
		<title>kashibox</title>
		<link rel="icon" type="image/svg+xml" href="/kashibox-icon.svg" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<style>
			html, body { margin: 0; height: 100%; }
			body {
				background: #333; color: #ddd; font-size: 16px;
				font-family: -apple-system, "system-ui", "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Fira Sans", "Droid Sans", "Helvetica Neue", sans-serif;
			}
			/* scroll bars, as in the old viewer: slim, transparent track, grey handle */
			::-webkit-scrollbar { width: 10px; }
			::-webkit-scrollbar-track { background: transparent; }
			::-webkit-scrollbar-thumb { background: rgb(102, 102, 102); border-radius: 3px; }
			::-webkit-scrollbar-thumb:hover { background: rgb(153, 153, 153); }
			.clickable, .pressable { cursor: pointer; }
			.clickable:hover, .pressable:hover { filter: brightness(1.15); }
			.pressable:active { position: relative; top: 0.5px; }

			/* page frame: a header row and the page below it */
			.app { height: 100vh; margin: auto; display: grid; grid: "header" 51px "main" / auto; }
			.app header {
				grid-area: header; display: grid; grid: "logo nav" / max-content auto;
				padding: 0 16px; border-bottom: 1px solid #606060;
			}
			.app main { grid-area: main; overflow: hidden; min-height: 0; }

			.logo {
				align-self: center; width: 108px; height: 28px; display: block;
				background: url("/kashibox-logo.svg") no-repeat 0% 50% / contain;
			}
			nav { display: flex; align-items: stretch; color: #a0a0a0; font-size: 17px; height: 50px; margin-left: 20px; }
			nav .likes, nav .bookmarked, nav .following {
				display: flex; align-items: center; border-bottom: 3px solid transparent; color: inherit; white-space: nowrap;
			}
			nav svg { fill: currentColor; }
		</style>
	</head>
	<body>
		<div id="archive">
			<div class="app">
				<header>
					<div class="logo" aria-label="kashibox"></div>
					<nav>
						<div class="likes pressable" title="Likes"><svg class="hearts-outline" viewBox="0 0 24 24"><path d="M12,21.1L10.5,22.4C3.9,16.5 0.5,13.4 0.5,9.6C0.5,8.4 0.9,7.3 1.5,6.4C1.5,6.6 1.5,6.8 1.5,7C1.5,11.7 5.4,15.2 12,21.1M13.6,17C18.3,12.7 21.5,9.9 21.6,7C21.6,5 20.1,3.5 18.1,3.5C16.5,3.5 15,4.5 14.5,5.9H12.6C12,4.5 10.5,3.5 9,3.5C7,3.5 5.5,5 5.5,7C5.5,9.9 8.6,12.7 13.4,17L13.5,17.1M18,1.5C21.1,1.5 23.5,3.9 23.5,7C23.5,10.7 20.1,13.8 13.5,19.8C6.9,13.9 3.5,10.8 3.5,7C3.5,3.9 5.9,1.5 9,1.5C10.7,1.5 12.4,2.3 13.5,3.6C14.6,2.3 16.3,1.5 18,1.5Z"></path></svg>Likes</div>
						<div class="bookmarked pressable" title="Favorites"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" class="bookmarks-icon"><path fill="none" d="M0 0h24v24H0V0z"></path><path d="M15 7v12.97l-4.21-1.81-.79-.34-.79.34L5 19.97V7h10m4-6H8.99C7.89 1 7 1.9 7 3h10c1.1 0 2 .9 2 2v13l2 1V3c0-1.1-.9-2-2-2zm-4 4H5c-1.1 0-2 .9-2 2v16l7-3 7 3V7c0-1.1-.9-2-2-2z"></path></svg>Favorites</div>
						<div class="following pressable" title="Following"><svg class="following-icon" viewBox="0 0 24 24"><path d="M10.5,11c1.7,0,3-1.3,3-3s-1.3-3-3-3s-3,1.3-3,3S8.8,11,10.5,11 M10.5,7c0.6,0,1,0.4,1,1s-0.4,1-1,1s-1-0.4-1-1 S9.9,7,10.5,7 M14.6,10.9c1.2-1.7,1.2-4,0-5.7C14.9,5,15.2,5,15.5,5c1.7,0,3,1.3,3,3s-1.3,3-3,3C15.2,11,14.9,11,14.6,10.9 M10.5,13 c-6,0-6,4-6,4v2h12v-2C16.5,17,16.5,13,10.5,13 M6.5,17c0-0.3,0.3-2,4-2c3.5,0,3.9,1.6,4,2 M21.5,17v2h-3v-2c0-1.5-0.7-2.9-1.8-3.9 C21.5,13.6,21.5,17,21.5,17 M5.5,12 M5.5,10"></path></svg>Following</div>
					</nav>
				</header>
				<main></main>
			</div>
		</div>
		<script>window.kashiboxShell = true;</script>
		<script src="/starplayer.js"></script>
	</body>
</html>
